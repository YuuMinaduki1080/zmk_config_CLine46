manifest:
  remotes:
    - name: cormoran
      url-base: https://github.com/cormoran
    - name: badjeff    # <-- PMW3610
      url-base: https://github.com/badjeff
    - name: caksoylar  # <-- RGB LED
      url-base: https://github.com/caksoylar
    - name: takamaru-fpv  # <-- Battery level smoothing
      url-base: https://github.com/takamaru-fpv

  projects:
    # ZMK: DYA Studio 用カスタム RPC サブシステム付き cormoran fork
    - name: zmk
      remote: cormoran
      revision: v0.3-branch+dya
      import: app/west.yml
    - name: zmk-feature-non-lipo-battery-management
      remote: takamaru-fpv
      revision: voltage_division

    # DYA Studio モジュール（すべて cormoran リポジトリ）
    # ZMK 本体が v0.3 世代のブランチ v0.3-branch+dya を追従しているため、モジュール側も同世代の API に揃える必要がある。
    # revision: main のままだと上流が動いた時点で予告なくビルドが壊れるため、
    # 同梱ファーム firmware/20260501/ がビルドされた 2026-05-01 時点の各 HEAD にコミット固定する。
    - name: zmk-module-ble-management
      remote: cormoran
      revision: 4c659c24a7c6810721576146ffca618c37837cea  # 2026-04-30
    - name: zmk-module-battery-history
      remote: cormoran
      revision: 307755dd2ad4d320e14de162e8e5ef018f29d929  # 2026-02-24
    - name: zmk-module-settings-rpc
      remote: cormoran
      revision: ad1c995cf910ca989ecd6352a1d0b41ccb18362c  # 2026-02-11
    - name: zmk-module-runtime-input-processor
      remote: cormoran
      revision: e643dfe30754495c875b19097832378faed26f24  # 2026-04-30
    - name: zmk-pmw3610-driver
      remote: badjeff
      revision: zmk-0.3
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: v0.3-branch
  self:
    path: config
