#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# アイドル状態。ディープスリープとは別物で、無効化していない。
CONFIG_ZMK_IDLE_TIMEOUT=30000

# ディープスリープは無効にしている。2 時間（旧 IDLE_SLEEP_TIMEOUT の 7200000ms）を超えて
# 放置すると、トラックボールを操作してもこの左側が復帰せず、両側の電源 OFF/ON でしか
# 戻らないため。左半分は自分の kscan（CLine46.dtsi の kscan0 に付いた wakeup-source）でしか
# 起きないので、右のボール操作では復帰しない。経緯の詳細は CLine46_R.conf の
# CONFIG_ZMK_SLEEP に付けたコメント。
# 戻す場合は ZMK_SLEEP を y にして IDLE_SLEEP_TIMEOUT のコメントを外す
# （IDLE_SLEEP_TIMEOUT は if ZMK_SLEEP 配下のため、ZMK_SLEEP=n のまま値を代入すると
# Kconfig 警告になる。CLine46_L.conf / CLine46_R.conf のどちらか一方だけ戻さないこと）。
# 出典: cormoran/zmk v0.3-branch+dya の app/Kconfig（2026-08-06 に参照して確認）
CONFIG_ZMK_SLEEP=n
#CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

##for NiMH battery
CONFIG_ZMK_NON_LIPO_BATTERY_MANAGEMENT=y

# optional
CONFIG_ZMK_NON_LIPO_MAX_MV=1360
CONFIG_ZMK_NON_LIPO_MIN_MV=1020
CONFIG_ZMK_NON_LIPO_LOW_MV=1000
#CONFIG_ZMK_NON_LIPO_ADV_SLEEP_TIMEOUT=60000
# 60 seconds


# ========================================
# DYA Studio 用の設定（Peripheral 側）
# ========================================
# バッテリー履歴（Peripheral 側）
CONFIG_ZMK_BATTERY_HISTORY=n

# Settings RPC（Peripheral 側）
CONFIG_ZMK_SETTINGS_RPC=y

# Split イベントリレー（Peripheral 側）
CONFIG_ZMK_SPLIT_RELAY_EVENT=y

# 設定の永続化
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000