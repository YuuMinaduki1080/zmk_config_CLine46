#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# アイドル状態。ディープスリープとは別物で、無効化していない。
CONFIG_ZMK_IDLE_TIMEOUT=30000

# ディープスリープは無効にできない。ZMK_NON_LIPO_BATTERY_MANAGEMENT が ZMK_SLEEP を
# select しているため、.conf に ZMK_SLEEP=n と書いても Kconfig 警告が出るだけで y のまま。
# そこでタイムアウトを 24 時間にしている。無効化ではなく先送りなので、24 時間を超えて
# 放置すれば同じ症状が出る。
# 制作者の報告では、2 時間設定時に超過後トラックボールを操作してもこの左側が復帰せず、
# 両側の電源 OFF/ON で戻ったとのこと（左のキー打鍵で復帰するかは本プロジェクトでは未検証）。
# 左半分は自分の kscan（CLine46.dtsi の kscan0 に付いた wakeup-source）でしか起きないため、
# 右のボール操作では復帰しない。
# IDLE_SLEEP_TIMEOUT を省略・コメントアウトすると既定の 900000ms（15 分）に落ちて症状が
# 悪化する。値は必ず書く。CLine46_R.conf と揃えること。
# 出典: cormoran/zmk v0.3-branch+dya の app/Kconfig、
# takamaru-fpv/zmk-feature-non-lipo-battery-management voltage_division の Kconfig
# （2026-08-06 に参照して確認）
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=86400000

##for NiMH battery
CONFIG_ZMK_NON_LIPO_BATTERY_MANAGEMENT=y

# optional
CONFIG_ZMK_NON_LIPO_MAX_MV=1360
CONFIG_ZMK_NON_LIPO_MIN_MV=1020
# LOW_MV 以下になると（USB 給電中を除く）、モジュールが zmk_pm_suspend_devices() の後に
# sys_poweroff() を呼ぶ。ウェイクアップ設定を伴わないため、復帰は電源の入れ直しかリセット。
CONFIG_ZMK_NON_LIPO_LOW_MV=1000
# ADV_SLEEP_TIMEOUT（既定 60000ms＝60 秒）は有効にしても動かない。モジュール側のガードが
# #if IS_ENABLED(CONFIG_ZMK_NON_LIPO_ADV_SLEEP_TIMEOUT) で、この設定は int のため
# IS_ENABLED が 0 になり、ブロックごとコンパイルから外れる。
#CONFIG_ZMK_NON_LIPO_ADV_SLEEP_TIMEOUT=60000


# ========================================
# DYA Studio 用の設定（Peripheral 側）
# ========================================
# バッテリー履歴（Peripheral 側）
CONFIG_ZMK_BATTERY_HISTORY=n

# Settings RPC（Peripheral 側）
CONFIG_ZMK_SETTINGS_RPC=y

# Split イベントリレー（Peripheral 側）
CONFIG_ZMK_SPLIT_RELAY_EVENT=y

# 設定の永続化
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000